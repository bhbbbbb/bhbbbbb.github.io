# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['master']

  repository_dispatch:
    types: [content-updated]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch site-data snapshot
        shell: bash
        run: |
          git fetch origin site-data
          echo "SITE_DATA_REF=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Load previous notes data from site-data
        shell: bash
        run: |
          rm -rf notes
          mkdir -p public/notes

          git checkout "$SITE_DATA_REF" -- notes

          if [ -d notes ]; then
            cp -R notes/. public/notes/
          fi
      - name: Load previous marketplace data from site-data
        shell: bash
        run: |
          mkdir -p data
          git show "$SITE_DATA_REF":data/marketplace.json > data/marketplace.json
      - name: Build
        run: pnpm build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
